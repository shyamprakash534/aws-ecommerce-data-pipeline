name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m py_compile app.py
      - name: Validate packaged output data
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root = Path('data/local_output')
          required = ['monthly_sales.csv', 'top_categories.csv', 'late_delivery_rate.csv']
          for name in required:
              path = root / name
              assert path.exists(), f'Missing {path}'
              df = pd.read_csv(path)
              assert not df.empty, f'Empty {path}'
          monthly = pd.read_csv(root / 'monthly_sales.csv')
          assert {'order_year_month', 'total_revenue'}.issubset(monthly.columns)
          print('output validation passed')
          PY
